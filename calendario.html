<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Organizador - Sistema de Gestión Personal</title>
    <link rel="stylesheet" href="css/calendar.css">
</head>
<body>

    <div class="app-container">
        <!-- BARRA SUPERIOR -->
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="btn-menu" aria-label="Menú principal">☰</button>
            </div>

            <div class="top-bar-center">
                <button class="btn-nav" aria-label="Anterior">&lt;</button>
                <h1 class="current-month">Septiembre de 2026</h1>
                <button class="btn-nav" aria-label="Siguiente">&gt;</button>
                 <button class="btn-today">Hoy</button>
            </div>

            <div class="top-bar-right">
                <select class="view-selector">
                    <option value="month" selected>Mes</option>
                </select>
            </div>
        </header>

        <!-- ÁREA PRINCIPAL -->
        <div class="main-content">
            <!-- BARRA LATERAL -->
            <aside class="sidebar">
                <details class="calendar-group" open>
                    <summary>Categorías / Filtros</summary>
                    <ul class="calendar-list" id="categoryList">
                        <!-- Carga dinámica vía JS -->
                    </ul>
                    <button class="btn-new-category" id="btnOpenCategoryModal">+ Nueva Categoría</button>
                </details>
            <!-- Copia de Seguridad Desplegable -->
                <details class="calendar-group sidebar-backup-section" open>
                    <summary>Copia de Seguridad</summary>
                    <div class="backup-content">
                        <button id="btnExportBackup" class="btn-backup">📥 Exportar Backup</button>
                        <button id="btnImportBackup" class="btn-backup btn-backup-import">📤 Importar Backup</button>
                        <input type="file" id="fileImportBackup" accept=".json" style="display: none;">
                    </div>
            </details>
            </aside>

            <!-- CUADRÍCULA DEL CALENDARIO -->
            <main class="calendar-month-view">
                <div class="month-header">
                    <div class="day-name">DOM</div>
                    <div class="day-name">LUN</div>
                    <div class="day-name">MAR</div>
                    <div class="day-name">MIÉ</div>
                    <div class="day-name">JUE</div>
                    <div class="day-name">VIE</div>
                    <div class="day-name">SÁB</div>
                </div>

                <div class="month-grid" id="monthGrid">
                    <!-- Días inyectados por JS -->
                </div>

                <!-- PALETA DE MODO PINTAR -->
                <div id="paintPalette" class="paint-palette hidden">
                    <span class="palette-title">Preset activo:</span>
                    <div id="presetChipsContainer" class="palette-chips">
                        <!-- Chips por JS -->
                    </div>
                </div>

                <!-- POPOVER AGENDAR EVENTO / NOTA -->
                <div id="eventPopover" class="popover hidden">
                    <div class="popover-header">
                        <h2 id="popoverTitle">AGENDAR</h2>
                        <button class="close-btn">&times;</button>
                    </div>
                    <form id="eventForm">
                        <input type="hidden" id="eventId">
                        <input type="hidden" id="eventDate">

                        <div class="form-group">
                            <input type="text" id="eventTitle" placeholder="Título (Ej: Trabajo, Consulta, Franco)" required autocomplete="off" class="title-input">
                        </div>

                        <div class="form-group">
                            <label for="eventCategory">Categoría</label>
                            <select id="eventCategory" required>
                                <!-- Inyectado por JS -->
                            </select>
                        </div>

                        <div class="form-group time-group">
                            <div>
                                <label for="eventStart">Hora Inicio</label>
                                <input type="time" id="eventStart">
                            </div>
                            <div>
                                <label for="eventEnd">Hora Fin</label>
                                <input type="time" id="eventEnd">
                            </div>
                        </div>

                        <div class="form-group">
                            <textarea id="eventDesc" placeholder="Notas adicionales o recordatorios..." rows="3"></textarea>
                        </div>

                        <div class="form-actions">
                            <button type="submit" class="btn-save" id="btnSaveEvent">Guardar</button>
                            <button type="button" class="btn-delete hidden" id="btnDeleteEvent">Borrar</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>

        <!-- BARRA DE ACCIONES INFERIOR (SHIFTER) -->
        <footer class="bottom-action-bar">
            <button class="action-tab active" id="tabModeEdit">
                <span class="tab-icon">✏️</span>
                <span class="tab-label">EDITAR</span>
            </button>
            <button class="action-tab" id="tabModePaint">
                <span class="tab-icon">🎨</span>
                <span class="tab-label">PINTAR</span>
            </button>
            <button class="action-tab" id="tabModeSummary">
                <span class="tab-icon">📊</span>
                <span class="tab-label">RESUMEN</span>
            </button>
        </footer>
    </div>

    <!-- MODAL CATEGORÍAS -->
    <div id="categoryModal" class="popover hidden">
        <div class="popover-header">
            <h2>Gestión de Categoría</h2>
            <button class="close-category-btn">&times;</button>
        </div>
        <form id="categoryForm">
            <input type="hidden" id="catId">
            <div class="form-group">
                <label for="catName">Nombre (Ej: Trabajo, Día de franco, Noche)</label>
                <input type="text" id="catName" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="catColor">Color</label>
                <input type="color" id="catColor" value="#1a73e8" required>
            </div>
            <button type="submit" class="btn-save">Guardar Categoría</button>
        </form>
    </div>

    <!-- MODAL RESUMEN MENSUAL -->
    <div id="summaryModal" class="overlay-modal hidden">
        <div class="overlay-content summary-content">
            <div class="popover-header">
                <h2>Resumen Mensual</h2>
                <button class="close-summary-btn">&times;</button>
            </div>
            <p id="summaryMonthText" class="summary-subtitle"></p>
            <div id="summaryStatsList" class="summary-stats-grid"></div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN -->
    <div id="confirmModal" class="overlay-modal hidden">
        <div class="overlay-content">
            <h2 id="confirmTitle">Confirmación</h2>
            <p id="confirmMessage" style="margin: 15px 0; color: var(--text-secondary);"></p>
            <div class="form-actions" style="justify-content: center; margin-top: 20px;">
                <button class="btn-save" id="btnConfirmOk">Aceptar</button>
                <button class="btn-delete" id="btnConfirmCancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script type="module" src="src/js/calendar.js"></script>
</body>
</html>
